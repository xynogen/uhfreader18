version: 2
updates:
  # Rotate SHA-pinned action versions so the pins don't rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # skip brand-new releases (compromised-release window)

  # Dev/build dependencies declared in pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
